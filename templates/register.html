{% extends "base.html" %}

{% block title %}Student Voter Registration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-primary text-white py-3 text-center">
                <h4 class="fw-bold mb-1"><i class="bi bi-person-plus-fill me-2"></i> Student Voter Registration</h4>
                <small class="opacity-75">St. Vincent Pallotti College of Engineering & Technology, Nagpur</small>
            </div>
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('register_post') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Student Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Yug Meshram" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">College UID / Roll No</label>
                            <input type="text" name="identifier" class="form-control" placeholder="e.g. 24001027" required>
                            <div class="form-text">Unique student identifier issued by college.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Campus Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="name@stvincentngp.edu.in" required>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Department</label>
                            <select name="department" class="form-select" required>
                                <option value="Department of Artificial Intelligence" selected>Artificial Intelligence</option>
                                <option value="Computer Engineering">Computer Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                                <option value="Electronics Engineering">Electronics Engineering</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Academic Year</label>
                            <select name="year" class="form-select" required>
                                <option value="1st Year">1st Year</option>
                                <option value="2nd Year">2nd Year</option>
                                <option value="3rd Year (Sem V)" selected>3rd Year (Sem V)</option>
                                <option value="Final Year">Final Year</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Choose Account Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter secure password" required minlength="4">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="bi bi-check2-circle me-1"></i> Register as Eligible Voter
                    </button>
                </form>
            </div>
            <div class="card-footer bg-light py-3 text-center">
                <span class="text-muted small">Already registered?</span> 
                <a href="{{ url_for('login_portal') }}" class="fw-bold text-decoration-none">Back to Login Portals</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
